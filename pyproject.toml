[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prode"
version = "0.1.0"
description = "Filesystem-backed project data layer exposed through an MCP server"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.3",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
prode = "prode.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: large-scale tests (deselect with -m 'not slow')"]
